[package]
name = "spacemaster"
version = "1.0.3"
edition = "2021"
description = "A very fast, native disk-space manager for Windows 11."
license = "MIT"
build = "build.rs"

[lib]
name = "spacemaster"
path = "src/lib.rs"

[[bin]]
name = "spacemaster"
path = "src/main.rs"

[[bin]]
name = "sm-bench"
path = "src/bin/sm-bench.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "UI",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Foundation_Numerics",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies]
windows-numerics = "0.3"
webview2-com = "0.39"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
zip = { version = "9", default-features = false, features = ["deflate", "bzip2"] }
quick-xml = "0.42"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rs = "0.3"
sevenz-rust2 = { version = "0.25", default-features = false }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
